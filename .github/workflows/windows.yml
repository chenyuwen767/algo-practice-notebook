name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Startup smoke test
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $exe = Get-ChildItem build -Recurse -Filter task_notebook_gui.exe | Select-Object -First 1
          # Start-Process -Wait 对这个 WIN32 GUI 程序会一直挂着，只能用 .NET 进程 + 超时。
          $info = New-Object System.Diagnostics.ProcessStartInfo
          $info.FileName = $exe.FullName
          $info.Arguments = "--portable --smoke-test"
          $info.UseShellExecute = $false
          $process = [System.Diagnostics.Process]::Start($info)
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw "Startup smoke test timed out"
          }
          $process.ExitCode | Write-Host
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }

      - name: Package portable build
        shell: pwsh
        run: |
          .\scripts\package.ps1 -SkipTests

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: algorithm-practice-notebook-windows-x64
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
